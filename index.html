<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake MIPS - UFMA Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Fira Code', monospace;
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .subtitle {
            color: #8b949e;
            font-size: 1.1rem;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .card h2 {
            font-size: 1.3rem;
            color: #58a6ff;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #8b949e;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #00ff88;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2ea043;
        }

        .btn-secondary {
            background-color: #1f6feb;
        }
        .btn-secondary:hover {
            background-color: #388bfd;
        }

        /* Ocultar elementos */
        .hidden {
            display: none !important;
        }

        /* Destaque do jogador atual */
        .player-highlight {
            background-color: rgba(88, 166, 255, 0.1);
            border: 1px dashed #58a6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .player-highlight span {
            display: block;
            font-size: 1.4rem;
            color: #58a6ff;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Tabela de Ranking */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }

        th {
            color: #8b949e;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            font-family: 'Fira Code', monospace;
        }

        .medal-1 { color: #ffd700; font-weight: bold; font-size: 1.1rem;} /* Ouro */
        .medal-2 { color: #c0c0c0; font-weight: bold; font-size: 1.05rem;} /* Prata */
        .medal-3 { color: #cd7f32; font-weight: bold; font-size: 1rem;} /* Bronze */

    </style>
</head>
<body>

    <header>
        <h1>🐍 Snake MIPS Dashboard</h1>
        <div class="subtitle">Integração Front-end e Ranking Global - UFMA</div>
    </header>

    <div class="container">
        
        <div class="card" id="painel-controle">
            
            <div id="passo-1">
                <h2>🎮 Passo 1: Identificação</h2>
                <div class="form-group">
                    <label for="nome">Digite seu Nome para iniciar:</label>
                    <input type="text" id="nome" placeholder="Ex: Arthur Felipe" autocomplete="off">
                </div>
                <button class="btn-secondary" onclick="prepararPartida()">Confirmar e Jogar no MARS</button>
            </div>

            <div id="passo-2" class="hidden">
                <h2>📥 Passo 2: Registrar Syscall</h2>
                <div class="player-highlight">
                    Partida em andamento:
                    <span id="nome-display"></span>
                </div>
                <p style="color: #8b949e; font-size: 0.85rem; margin-bottom: 15px; text-align: center;">
                    Jogue no simulador MARS. Ao finalizar, verifique a pontuação no terminal e insira abaixo.
                </p>
                <div class="form-group">
                    <label for="pontos">Score Emitido pelo MIPS:</label>
                    <input type="number" id="pontos" placeholder="Ex: 42">
                </div>
                <button onclick="finalizarPartida()">Salvar Score e Atualizar Ranking</button>
                <button onclick="cancelarPartida()" style="background-color: transparent; color: #f85149; border: 1px solid #f85149;">Cancelar Partida</button>
            </div>

        </div>

        <div class="card">
            <h2>🏆 Tabela de Líderes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Jogador</th>
                        <th>Score (Bytes)</th>
                    </tr>
                </thead>
                <tbody id="tabela-ranking">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        let jogadorAtual = "";

        // Passo 1 -> Passo 2
        function prepararPartida() {
            const nomeInput = document.getElementById('nome').value.trim();
            if (nomeInput === "") {
                alert("Por favor, informe seu nome antes de jogar!");
                return;
            }
            
            jogadorAtual = nomeInput;
            document.getElementById('nome-display').innerText = jogadorAtual;
            
            // Esconde Passo 1, Mostra Passo 2
            document.getElementById('passo-1').classList.add('hidden');
            document.getElementById('passo-2').classList.remove('hidden');
            
            // Foca automaticamente no campo de pontuação
            document.getElementById('pontos').focus();
        }

        // Cancelar se o jogador desistir
        function cancelarPartida() {
            jogadorAtual = "";
            document.getElementById('nome').value = "";
            document.getElementById('pontos').value = "";
            
            // Esconde Passo 2, Mostra Passo 1
            document.getElementById('passo-2').classList.add('hidden');
            document.getElementById('passo-1').classList.remove('hidden');
        }

        // Passo 2 -> Salvar no Banco e Atualizar
        function finalizarPartida() {
            const pontosInput = document.getElementById('pontos').value;
            const pontos = parseInt(pontosInput);

            if (isNaN(pontos)) {
                alert('Erro: Insira a pontuação numérica gerada pelo MARS!');
                return;
            }

            // Resgatar ranking antigo, adicionar o novo, ordenar e salvar no LocalStorage
            let ranking = JSON.parse(localStorage.getItem('snakeRankingUFMA')) || [];
            ranking.push({ nome: jogadorAtual, score: pontos });
            localStorage.setItem('snakeRankingUFMA', JSON.stringify(ranking));

            // Voltar para a tela inicial
            cancelarPartida();
            
            // Atualizar Tabela Visual
            carregarRanking();
        }

        // Carregar a tabela de líderes do navegador
        function carregarRanking() {
            let ranking = JSON.parse(localStorage.getItem('snakeRankingUFMA')) || [];
            
            // Ordem decrescente (Maior pontuação no topo)
            ranking.sort((a, b) => b.score - a.score);
            
            const tbody = document.getElementById('tabela-ranking');
            tbody.innerHTML = '';

            if (ranking.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #8b949e;">Nenhuma partida registrada ainda.</td></tr>';
                return;
            }

            // Renderizar o Top 5
            ranking.slice(0, 5).forEach((jogador, index) => {
                let classeMedalha = '';
                if (index === 0) classeMedalha = 'medal-1';
                else if (index === 1) classeMedalha = 'medal-2';
                else if (index === 2) classeMedalha = 'medal-3';

                tbody.innerHTML += `
                    <tr>
                        <td class="${classeMedalha}">${index + 1}º</td>
                        <td class="${classeMedalha}">${jogador.nome}</td>
                        <td class="${classeMedalha}">${jogador.score}</td>
                    </tr>
                `;
            });
        }

        // Inicializa a tabela quando a página carrega
        window.onload = carregarRanking;
    </script>
</body>
</html>
