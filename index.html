<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake MIPS - UFMA Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Fira Code', monospace;
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .subtitle {
            color: #8b949e;
            font-size: 1.1rem;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .card h2 {
            font-size: 1.3rem;
            color: #58a6ff;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #8b949e;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #00ff88;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2ea043;
        }

        .btn-secondary {
            background-color: #1f6feb;
        }
        .btn-secondary:hover {
            background-color: #388bfd;
        }

        .hidden {
            display: none !important;
        }

        .player-highlight {
            background-color: rgba(88, 166, 255, 0.1);
            border: 1px dashed #58a6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .player-highlight span {
            display: block;
            font-size: 1.4rem;
            color: #58a6ff;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Efeito visual do Radar funcionando */
        @keyframes pulse {
            0% { opacity: 1; text-shadow: 0 0 10px #58a6ff; }
            50% { opacity: 0.5; text-shadow: none; }
            100% { opacity: 1; text-shadow: 0 0 10px #58a6ff; }
        }
        .radar-ativo {
            animation: pulse 1.5s infinite;
            color: #58a6ff;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            background: rgba(88, 166, 255, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }

        th {
            color: #8b949e;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            font-family: 'Fira Code', monospace;
        }

        .medal-1 { color: #ffd700; font-weight: bold; font-size: 1.1rem;} 
        .medal-2 { color: #c0c0c0; font-weight: bold; font-size: 1.05rem;} 
        .medal-3 { color: #cd7f32; font-weight: bold; font-size: 1rem;} 
    </style>
</head>
<body>

    <header>
        <h1>🐍 Snake MIPS Dashboard</h1>
        <div class="subtitle">Integração Front-end e Ranking Global - UFMA</div>
    </header>

    <div class="container">
        
        <div class="card" id="painel-controle">
            
            <div id="passo-1">
                <h2>🎮 Passo 1: Identificação</h2>
                <div class="form-group">
                    <label for="nome">Digite seu Nome para iniciar:</label>
                    <input type="text" id="nome" placeholder="Ex: Arthur Felipe" autocomplete="off">
                </div>
                <button class="btn-secondary" onclick="prepararPartida()">Confirmar e Ligar Radar</button>
            </div>

            <div id="passo-2" class="hidden">
                <h2>📥 Sincronização via Syscall</h2>
                <div class="player-highlight">
                    Partida em andamento:
                    <span id="nome-display"></span>
                </div>
                
                <div class="radar-ativo" id="status-radar">
                    📡 Escutando o processador MIPS...<br>Jogue no MARS e morra para sincronizar.
                </div>

                <button onclick="cancelarPartida()" style="background-color: transparent; color: #f85149; border: 1px solid #f85149;">Cancelar Partida</button>
            </div>

        </div>

        <div class="card">
            <h2>🏆 Tabela de Líderes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Jogador</th>
                        <th>Score (Bytes)</th>
                    </tr>
                </thead>
                <tbody id="tabela-ranking">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let jogadorAtual = "";
        let radarInterval = null;
        let lastModified = null;

        // Passo 1: Liga o Radar
        function prepararPartida() {
            const nomeInput = document.getElementById('nome').value.trim();
            if (nomeInput === "") {
                alert("Por favor, informe seu nome antes de jogar!");
                return;
            }
            
            jogadorAtual = nomeInput;
            document.getElementById('nome-display').innerText = jogadorAtual;
            
            document.getElementById('passo-1').classList.add('hidden');
            document.getElementById('passo-2').classList.remove('hidden');
            
            iniciarRadarWeb();
        }

        // Função de escape manual
        function cancelarPartida() {
            jogadorAtual = "";
            document.getElementById('nome').value = "";
            clearInterval(radarInterval); // Desliga o radar
            
            document.getElementById('passo-2').classList.add('hidden');
            document.getElementById('passo-1').classList.remove('hidden');
        }

        // A MÁGICA: O Middleware que conecta com o MIPS
        async function verificarHardware() {
            try {
                // Usa um truque (?t=timestamp) para o navegador nunca usar cache antigo
                const url = 'score.bin?t=' + Date.now();
                
                // Primeiro fazemos um pedido HEAD apenas para ler a data de modificação
                const resHead = await fetch(url, { method: 'HEAD' });
                
                if (resHead.ok) {
                    const currentModified = resHead.headers.get('Last-Modified');
                    
                    // Se for a primeira leitura da partida, apenas guarda a data atual
                    if (lastModified === null) {
                        lastModified = currentModified;
                        return;
                    }
                    
                    // Se a data de modificação mudou, significa que a Syscall 16 fechou um novo arquivo!
                    if (currentModified !== lastModified) {
                        lastModified = currentModified;
                        
                        // Busca o arquivo físico gerado
                        const resData = await fetch(url);
                        const buffer = await resData.arrayBuffer(); // Lê como array de bytes bruto
                        
                        // Tradutor de Arquitetura: Lê os 4 bytes em formato Little-Endian
                        const view = new DataView(buffer);
                        const pontosMips = view.getInt32(0, true); 
                        
                        salvarNoBanco(pontosMips);
                    }
                }
            } catch(e) {
                // Arquivo score.bin pode não existir ainda, apenas ignora e tenta no próximo pulso
            }
        }

        function iniciarRadarWeb() {
            lastModified = null; 
            // O JavaScript vai verificar o disco a cada 1.5 segundos (Polling)
            radarInterval = setInterval(verificarHardware, 1500);
        }

        function salvarNoBanco(pontos) {
            clearInterval(radarInterval); // Para a varredura contínua
            
            // Puxa o banco de dados atual do navegador
            let ranking = JSON.parse(localStorage.getItem('snakeRankingUFMA')) || [];
            
            // Procura se o jogador já existe na lista (ignorando letras maiúsculas/minúsculas)
            let jogadorExistente = ranking.find(j => j.nome.toLowerCase() === jogadorAtual.toLowerCase());

            if (jogadorExistente) {
                // Se o jogador já existe, atualiza SÓ se a pontuação nova for maior
                if (pontos > jogadorExistente.score) {
                    jogadorExistente.score = pontos;
                }
            } else {
                // Se não encontrou o jogador, adiciona como um jogador novo
                ranking.push({ nome: jogadorAtual, score: pontos });
            }

            // Salva a lista atualizada de volta no banco de dados do navegador
            localStorage.setItem('snakeRankingUFMA', JSON.stringify(ranking));

            cancelarPartida(); // Volta para a tela inicial
            carregarRanking(); // Renderiza a tabela nova atualizada
        }

        // Carregar a tabela visual
        function carregarRanking() {
            let ranking = JSON.parse(localStorage.getItem('snakeRankingUFMA')) || [];
            
            ranking.sort((a, b) => b.score - a.score);
            
            const tbody = document.getElementById('tabela-ranking');
            tbody.innerHTML = '';

            if (ranking.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #8b949e;">Nenhuma partida registrada ainda.</td></tr>';
                return;
            }

            ranking.slice(0, 5).forEach((jogador, index) => {
                let classeMedalha = '';
                if (index === 0) classeMedalha = 'medal-1';
                else if (index === 1) classeMedalha = 'medal-2';
                else if (index === 2) classeMedalha = 'medal-3';

                tbody.innerHTML += `
                    <tr>
                        <td class="${classeMedalha}">${index + 1}º</td>
                        <td class="${classeMedalha}">${jogador.nome}</td>
                        <td class="${classeMedalha}">${jogador.score}</td>
                    </tr>
                `;
            });
        }

        window.onload = carregarRanking;
    </script>
</body>
</html>
